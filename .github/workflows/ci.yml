name: Validate PowerShell module
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          fetch-depth: 0
      - name: Install test tools
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Locate GnuPG for isolated tests
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gpg -ErrorAction SilentlyContinue)) {
            $candidates = @("${env:ProgramFiles}\Git\usr\bin", "${env:ProgramFiles(x86)}\GnuPG\bin", "${env:ProgramFiles}\GnuPG\bin")
            $directory = $candidates | Where-Object { Test-Path (Join-Path $_ 'gpg.exe') } | Select-Object -First 1
            if (-not $directory) { throw 'GnuPG is missing from the Windows runner.' }
            $directory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Check release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ./scripts/Test-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Validate and test
        run: ./scripts/Test-Module.ps1
      - name: Analyze module
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $findings = @(Invoke-ScriptAnalyzer -Path ./src -Recurse)
          $findings | Format-Table -AutoSize
          if (@($findings | Where-Object Severity -eq Error).Count) { throw 'ScriptAnalyzer errors found.' }
      - name: Stage module
        run: ./scripts/Build-Module.ps1
      - name: Test local package publication and installation
        if: matrix.shell == 'pwsh'
        run: |
          $ErrorActionPreference = 'Stop'
          $feed = Join-Path $env:RUNNER_TEMP 'maven-gallery-feed'
          $installed = Join-Path $env:RUNNER_TEMP 'maven-gallery-install'
          New-Item $feed, $installed -ItemType Directory -Force | Out-Null
          Register-PSRepository -Name MavenLocalTest -SourceLocation $feed -PublishLocation $feed -InstallationPolicy Trusted
          try {
            Publish-Module -Path ./dist/Apexfission.MavenTools -Repository MavenLocalTest -NuGetApiKey local-test-only
            $version = (Import-PowerShellDataFile ./dist/Apexfission.MavenTools/Apexfission.MavenTools.psd1).ModuleVersion
            Save-Module -Name Apexfission.MavenTools -RequiredVersion $version -Repository MavenLocalTest -Path $installed
            $manifest = Get-ChildItem $installed -Recurse -Filter Apexfission.MavenTools.psd1 | Select-Object -First 1
            Import-Module $manifest.FullName -Force
            if (@(Get-Command -Module Apexfission.MavenTools).Count -ne 6) { throw 'Installed package exports are incomplete.' }
          } finally { Unregister-PSRepository MavenLocalTest }
      - uses: actions/upload-artifact@v4
        if: matrix.shell == 'pwsh'
        with:
          name: powershell-module
          path: dist/Apexfission.MavenTools/
